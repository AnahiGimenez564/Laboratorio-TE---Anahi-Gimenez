<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Contraseñas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="generador">
        <h1>Generador de Contraseñas</h1>

        <label><input type="number" id="tamano" name="tamano" min="8" max="80" value="8"> <em>Tamaño</em></label>
        <label><input type="checkbox" id="mayuscula"> <em>Mayúsculas</em></label>
        <label><input type="checkbox" id="minuscula"> <em>Minúsculas</em></label>
        <label><input type="checkbox" id="numero"> <em>Números</em></label>
        <label><input type="checkbox" id="simbolo"> <em>Símbolos</em></label>
        <br><br>

        <button onclick="generarContrasena()">Generar contraseña</button>

        <p id="resultado" style="background-color: rgb(205, 250, 115);"></p>

        <button id="btn-copiar" onclick="copiar()" disabled>Copiar</button>

        <p id="mensaje"></p>

        <script src="script.js"></script>
    </div>
</body>
</html>
